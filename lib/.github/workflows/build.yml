name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Create Complete Project and Copy Code
      run: |
        flutter create --org com.moshoura.sebha --project-name sebha_app app_build
        cp lib/main.dart app_build/lib/main.dart

    - name: Build Release APK
      working-directory: app_build
      run: |
        flutter pub get
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Athkar-Elshoura-APK
        path: app_build/build/app/outputs/flutter-apk/app-release.apk
